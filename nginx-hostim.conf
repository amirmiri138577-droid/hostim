# Hostim terminates public HTTPS and forwards HTTP/2 requests to this port.
# The local PasarGuard node still terminates TLS on 62050.
server {
    listen 8080 http2;
    server_name _;

    location / {
        grpc_pass grpcs://127.0.0.1:62050;
        grpc_ssl_verify off;
        grpc_read_timeout 1h;
        grpc_send_timeout 1h;
    }
}
